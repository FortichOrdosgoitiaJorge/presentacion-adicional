# Pipeline CI/CD del sistema de inventario (GitLab CI/CD)
#
# Flujo de ramas:
#   feature/* --MR--> develop  : validación (no despliega)
#   develop (push)             : build, publish y deploy a DEV
#   qa (push)                  : build, publish y deploy a QA
#   master (push)              : build, publish y deploy a STAGING
#   tag v*                     : build, publish y deploy a PRODUCCIÓN (manual)
#
# Variables requeridas en Settings > CI/CD > Variables (masked y protected cuando aplique):
#   SONAR_HOST_URL, SONAR_TOKEN       -> análisis estático y quality gate
#   DEPLOY_HOST, DEPLOY_USER          -> destino SSH por entorno (ver scripts/deploy.sh)
#   DEPLOY_SSH_KEY (tipo File)        -> llave privada SSH del usuario de despliegue
#   DB_PASSWORD                       -> contraseña de PostgreSQL en cada entorno
# Variables predefinidas usadas: CI_REGISTRY*, CI_COMMIT_SHA, CI_COMMIT_BRANCH, CI_COMMIT_TAG

stages:
  - validate
  - security
  - test
  - quality
  - build
  - publish
  - deploy

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHA"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOCKER_TLS_CERTDIR: "/certs"

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0

# ---------- Reglas reutilizables ----------

.rules_validation:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "qa" || $CI_COMMIT_BRANCH == "master"'

.rules_artifact:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "qa" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# ---------- Validación ----------

validate-code:
  stage: validate
  extends: .rules_validation
  script:
    - ./scripts/validate.sh

# ---------- Seguridad ----------

detect-secrets:
  stage: security
  extends: .rules_validation
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    # Falla si encuentra claves, tokens o contraseñas en el código o el historial del MR
    - gitleaks detect --source . --redact --verbose --no-banner

check-dependencies:
  stage: security
  extends: .rules_validation
  script:
    - ./scripts/security-check.sh

# ---------- Pruebas ----------

unit-tests:
  stage: test
  extends: .rules_validation
  script:
    - ./scripts/test.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - TestResults/

# ---------- Análisis estático y quality gate ----------

quality-gate:
  stage: quality
  extends: .rules_validation
  script:
    - ./scripts/quality-check.sh
  variables:
    SONAR_TOKEN: "$SONAR_TOKEN"
    SONAR_HOST_URL: "$SONAR_HOST_URL"

# ---------- Build: la imagen se construye una sola vez ----------

build-image:
  stage: build
  extends: .rules_artifact
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker save "$IMAGE_NAME:$IMAGE_TAG" -o image.tar
  artifacts:
    expire_in: 1 hour
    paths:
      - image.tar

# ---------- Publicación en el Container Registry ----------

publish-image:
  stage: publish
  extends: .rules_artifact
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker load -i image.tar
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    # En un tag, se publica también con el nombre de la versión (vX.Y.Z)
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:$CI_COMMIT_TAG"
        docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
      fi

# ---------- Despliegues por entorno (misma imagen, distinta configuración) ----------

.deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
  script:
    - ./scripts/deploy.sh "$CI_ENVIRONMENT_NAME" "$IMAGE_NAME:$IMAGE_TAG"

deploy-dev:
  extends: .deploy
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-qa:
  extends: .deploy
  environment:
    name: qa
  rules:
    - if: '$CI_COMMIT_BRANCH == "qa"'

deploy-staging:
  extends: .deploy
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy-production:
  extends: .deploy
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual          # requiere aprobación humana antes de producción
      allow_failure: false
